services:

  # ── MySQL Database ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: dat_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Bound to localhost only — the backend reaches this over the internal
      # docker network via the "db" hostname either way, so this mapping only
      # exists for admins to connect a DB tool (e.g. DBeaver) *from the server
      # itself* or over an SSH tunnel. Do not change the left side to "3307:3306"
      # (all interfaces) in production — that would expose the database to
      # the whole office network.
      - "127.0.0.1:3307:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql   # persists data between restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ── Spring Boot Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dat_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Origins allowed to call the API from a browser. Keeps localhost:3000
      # working for anyone still running the frontend locally against this
      # shared backend, and adds the real deployed frontend origin.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://${SERVER_IP}:3000
      # Same HTTPS switch as the frontend's COOKIE_SECURE below, kept in sync
      # via the single COOKIE_SECURE value in .env. Controls whether the
      # forgot-password OTP session cookie requires HTTPS.
      SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-false}
    #      SPRING_MAIL_HOST: ${MAIL_HOST}
    #      SPRING_MAIL_PORT: ${MAIL_PORT}
    #      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
    #      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
    volumes:
      - certificate_uploads:/data/uploads   # holds certificates/, profiles/, and courses/
    depends_on:
      db:
        condition: service_healthy   # waits for MySQL to be ready

  # ── Next.js Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${SERVER_IP}:8080
    container_name: dat_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Flip COOKIE_SECURE to "true" in .env once this is served behind HTTPS
      # (reverse proxy/TLS termination) — until then the browser will silently
      # refuse to store a Secure cookie over plain HTTP and login will appear
      # to do nothing. Also flips SESSION_COOKIE_SECURE on the backend above.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      - backend

volumes:
  mysql_data:    # named volume — MySQL data survives container restarts
  certificate_uploads: