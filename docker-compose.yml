services:
  db:
    image: mysql:8.4
    container_name: dat_mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-slogin}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"

  backend:
    build:
      context: ./backend
    container_name: dat_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-slogin}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-before-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      FILE_UPLOAD_DIR: /app/uploads/certificates
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - uploaded_files:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

    container_name: dat_frontend

    depends_on:
      - backend

    environment:
      NODE_ENV: development

      # used only by Next.js server actions and server components
      API_INTERNAL_URL: http://backend:8080

      # used by code running in the Windows browser
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

    command: npm run dev -- --hostname 0.0.0.0 --port 3000

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
      - uploaded_files:/app/public/uploads:ro

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mysql_data:
  uploaded_files:
  frontend_node_modules:
  frontend_next:
