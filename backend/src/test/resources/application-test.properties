# ── DATABASE ───────────────────────────────────────────────────────────────────
# Replace MySQL with H2 in-memory database — no installation needed, auto-resets
# MODE=MySQL makes H2 understand MySQL syntax so your JPA queries don't break
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create tables from your @Entity classes on startup, drop them after tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Shows every SQL query in the test console — very useful when a test fails
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable data.sql execution in tests because main data.sql contains very long text fields
spring.sql.init.mode=never

# ── EMAIL ───────────────────────────────────────────────────────────────────────
# Fake SMTP — prevents real emails during tests
# No actual mail server needed; the app won't crash if SMTP is unavailable
spring.mail.host=localhost
spring.mail.port=3025

# ── JWT ─────────────────────────────────────────────────────────────────────────
# Replace these key names with whatever your actual application.properties uses
# Use a dummy secret — never use your real production secret in test files
jwt.secret=test-secret-key-for-testing-only
jwt.expiration=3600000

# ── LOGGING ─────────────────────────────────────────────────────────────────────
# See what Spring Security is doing — helps debug unexpected 403s
logging.level.org.springframework.security=DEBUG
# See what SQL is actually being executed
logging.level.org.hibernate.SQL=DEBUG