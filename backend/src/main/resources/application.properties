spring.profiles.active=local

server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.expiration=3600000

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

logging.level.com.example.auth=INFO
logging.level.org.springframework.security=INFO

spring.web.resources.static-locations=classpath:/static/,classpath:/frontend/,classpath:/resources/,classpath:/META-INF/resources/

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Enable SQL initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

file.upload-dir=../frontend/public/uploads/certificates

