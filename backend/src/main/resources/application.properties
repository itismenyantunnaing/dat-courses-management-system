spring.profiles.active=local

server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.expiration=3600000

# Browser origins allowed to call this API (comma-separated). Local dev only
# needs the Next.js dev server itself.
app.cors.allowed-origins=http://localhost:3000

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

logging.level.com.example.auth=INFO
logging.level.org.springframework.security=INFO

spring.web.resources.static-locations=classpath:/static/,classpath:/frontend/,classpath:/resources/,classpath:/META-INF/resources/

# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.starttls.required=true

# Enable SQL initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# file.upload-dir=../frontend/public/uploads/certificates
# # NOT nested under uploads/ on purpose: this matches where profile images
# # already live locally from before this fix (frontend/public/profiles), so
# # existing local dev data/seed images keep working without a manual move.
# file.profile-upload-dir=../frontend/public/profiles
# certificate.upload.path=/data/uploads/certificates


# Certificate uploads - stored in imageStorage/certificates
file.upload-dir=./imageStorage/certificates

# Profile images - stored in imageStorage/profiles
file.profile-upload-dir=./imageStorage/profiles

# Course images - stored in imageStorage/courses
file.course-upload-dir=./imageStorage/courses

# Certificate upload path (for backward compatibility)
certificate.upload.path=./imageStorage/certificates

# File upload size limits — must stay >= the largest limit advertised in the UI
# (certificate form says "Maximum 10 MB", profile photo form says "Maximum 5MB").
# These two properties control the servlet-level cap (rejects before reaching our code).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application-level caps used by CertificateService / EmployeeProfileService.
# Keep in sync with the multipart limits above and with the frontend copy.
file.max-size=10485760
file.profile-max-size=5242880