# Database — reads from environment variables set by docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET}

# Browser origins allowed to call this API (comma-separated). Set by
# docker-compose from CORS_ALLOWED_ORIGINS, which is derived from SERVER_IP
# in the root .env — falls back to localhost if that's ever unset.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Forgot-password OTP relies on HttpSession across requests. When served over
# plain HTTP (no TLS yet), Secure cookies are not stored by browsers, so OTP
# verification loses session state and returns "OTP not generated".
# Set false by default for current non-HTTPS deployments; switch to true once
# the app is behind HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Mail
#spring.mail.host=${SPRING_MAIL_HOST}
#spring.mail.port=${SPRING_MAIL_PORT}
#spring.mail.username=${SPRING_MAIL_USERNAME}
#spring.mail.password=${SPRING_MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=/data/uploads/certificates
file.profile-upload-dir=/data/uploads/profiles

# No SQL logging in production
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN